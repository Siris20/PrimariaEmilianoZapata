backend:
  name: git-gateway
  branch: master   # o la rama que uses (main o master)

media_folder: "assets"          # Carpeta donde se subirán las imágenes
public_folder: "/assets"        # Ruta pública para acceder a las imágenes

collections:
  - name: "avisos"
    label: "Avisos y Noticias del Carrousel"
    label_singular: "Aviso o Noticia"
    folder: "data"                 # Carpeta donde está noticias.json
    create: true                  # Permite crear nuevos
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "json"
    format: "json"
    identifier_field: "titulo"
    summary: "{{titulo}} — {{descripcion | truncate 50}}"

    # Este es el formato de un solo archivo JSON con lista
    fields:
      - label: "Avisos y Noticias"
        name: "items"
        widget: "list"
        summary: "{{fields.titulo}}"
        fields:
          - { label: "Título", name: "titulo", widget: "string", required: true }
          - { label: "Descripción", name: "descripcion", widget: "text", required: true }
          - { label: "Imagen de fondo", name: "imagen", widget: "image", required: true }