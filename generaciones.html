<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="./E_generaciones.css">
</head> 
<!-- Navbar -->
  <div id="navbar-placeholder"></div>
<body>
   

  <section class="generaciones-section">
    <div class="container_generacion">
      <h2 class="title">GENERACIONES DE NUESTRA ESCUELA</h2>

      <div class="controls">
        <input type="text" id="buscarGeneracion" placeholder="Buscar por generación" autocomplete="off">
        <div class="arrows">
          <button id="prevBtn" class="arrow-btn">←</button>
          <button id="nextBtn" class="arrow-btn">→</button>
        </div>
      </div>

      <div id="galeria" class="galeria">
        <!-- Las imágenes se cargan con JavaScript -->
      </div>
      
      <div id="paginacion-info" class="paginacion-info">
        Mostrando <span id="mostrando">1-3</span> de <span id="total">45</span>
      </div>
    </div>
  </section>

  <script src="./J_generaciones.js"></script>

   <!-- Footer -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function(){ var el = document.querySelector('a[href="../index.html"]'); if(el) el.classList.add('active'); });</script>
  <script>
    $(function() {
      // $("#footer-placeholder").load("Componentes/footer.html");
      $("#footer-placeholder").load("Componentes/footer.html");
      $("#navbar-placeholder").load("Componentes/navbar.html");
    });
  </script>
  <script>
    window.addEventListener('scroll', function() {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });
  </script>
  <script src="./currentpage.js"></script>
</body>
</html>
